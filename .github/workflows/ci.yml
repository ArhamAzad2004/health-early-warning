name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: docker build -t sentinel .
      - name: Smoke test the one-app image
        run: |
          docker run -d -p 8000:8000 --name app sentinel
          for i in $(seq 1 30); do curl -sf localhost:8000/api/meta && break; sleep 2; done
          curl -sf localhost:8000/ | grep -q "<title>Sentinel Dubai</title>"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/docs)" = 404  # API docs are off in the image
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: End-to-end demo path in a real browser
        working-directory: frontend
        env: { E2E_URL: "http://localhost:8000" }
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --reporter=line
